name: Build

on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: packages/app

      - name: Execution permission
        run: chmod +x gradlew
        working-directory: packages/app

      - name: Build
        run: ./gradlew assembleDebug
        working-directory: packages/app

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: debug
          path: packages/app/app/build/outputs/apk/debug/app-debug.apk
