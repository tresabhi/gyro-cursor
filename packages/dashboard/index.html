<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gyro Cursor</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #000;
        color: #fff;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      table {
        border-collapse: collapse;
      }
      th,
      td {
        border: 2px solid #fff;
        padding: 12px 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Gyro Cursor</h2>
      <table>
        <tr>
          <th>Title</th>
          <th>State</th>
          <th></th>
        </tr>
        <tr>
          <td>Cursor</td>
          <td id="cursor-state">…</td>
          <td><button id="cursor-cycle">Cycle</button></td>
        </tr>
      </table>
    </main>
    <script>
      const state = document.getElementById("cursor-state");
      new EventSource("/api/state/cursor/events").onmessage = (e) => {
        state.textContent = e.data;
      };
      document.getElementById("cursor-cycle").onclick = () =>
        fetch("/api/state/cursor/cycle", { method: "POST" });
    </script>
  </body>
</html>
